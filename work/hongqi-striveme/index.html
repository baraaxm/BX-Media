    .video-main .video-wrapper {
      position: relative;
      width: min(900px, 100%);
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      border-radius: 12px;
      border: 2px solid #ff6600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      transition: all 0.4s ease;
    }

    .video-main .video-wrapper.tall {
      aspect-ratio: 9 / 16;
      width: min(540px, 100%);
    }

    .video-main .video-wrapper:hover {
      border-color: #ffa64d;
      box-shadow: 0 0 20px rgba(255, 102, 0, 0.6);
      transform: scale(1.01);
    }

    .video-thumbs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      align-items: start;
    }

    .video-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      animation: thumbSlide 0.5s ease;
      animation-delay: calc(var(--index) * 0.1s);
      animation-fill-mode: backwards;
    }

    @keyframes thumbSlide {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .video-thumb.tall { 
      aspect-ratio: 9 / 16; 
    }

    .video-thumb.is-active,
    .video-thumb:hover {
      border-color: #ff6600;
      box-shadow: 0 0 15px rgba(255, 102, 0, 0.5);
      transform: translateY(-4px);
    }

    .video-thumb iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 100px 0 30px;
      padding: 12px 24px;
      color: #fff;
      background: linear-gradient(135deg, #ff6600, #ff914d);
      border-radius: 30px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(255, 102, 0, 0.3);

    @keyframes slideInLeft {

      to {

        transform: translateX(0);
      }
    }

    .back-link::before {
      content: "←";
      font-size: 1.2rem;
      line-height: 1;
      transition: transform 0.3s ease;
    }

    .back-link:hover {
      background: linear-gradient(135deg, #ff914d, #ff6600);
      transform: translateX(-5px);
      box-shadow: 0 10px 25px rgba(255, 102, 0, 0.5);
    }

    .back-link:hover::before {
      transform: translateX(-5px);
    }

    @media (max-width: 768px) {
      .video-gallery { 
        margin-bottom: 60px; 
      }
      
      .video-thumbs {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .project-detail-container h1 {

  <script>
(function () {
  var DT = "Hongqi × StriveME";
  var videos = [{"t":"Hongqi Reel 1","s":"https://player.vimeo.com/video/1102640419?h=450e9d6c88","a":"portrait"},{"t":"Hongqi Reel 2","s":"https://player.vimeo.com/video/1102639970?h=14791dfc05","a":"portrait"},{"t":"Hongqi Reel 3","s":"https://player.vimeo.com/video/1102639636?h=0cef0c92c1","a":"portrait"}];
  var gallery = document.querySelector('.video-gallery');
  if (!gallery) return;
  var main = gallery.querySelector('.video-main');
  var titleEl = gallery.querySelector('h3');
  var thumbs = gallery.querySelector('.video-thumbs');
  if (!main || !thumbs) return;
  var current = 0;
  function render(i) {
    var v = videos[i];
    if (!v || i === current) return;
    current = i;
    var tall = v.a === 'portrait' ? ' tall' : '';
    if (titleEl) titleEl.textContent = v.t || '';
    main.innerHTML = '<div class="video-wrapper' + tall + '"><iframe src="' + v.s +
      '" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy" title="' +
      (DT + ': ' + (v.t || '')).replace(/"/g, '&quot;') + '"></iframe></div>';
    thumbs.querySelectorAll('.video-thumb').forEach(function (b) {
      b.classList.toggle('is-active', Number(b.dataset.index) === i);
    });
    if (window.matchMedia('(max-width: 768px)').matches) {
      main.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }
  thumbs.querySelectorAll('.video-thumb').forEach(function (btn) {
    btn.addEventListener('click', function () { render(Number(btn.dataset.index)); });
  });
})();
</script>
